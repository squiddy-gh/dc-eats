<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DC Eats Map</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <header class="intro">
      <p class="eyebrow">DC Eats</p>
      <h1>Explore the lists</h1>
      <p>Restaurants and dishes from Loudoun County and the Washington area. Select a marker to see its details.</p>
      <div id="legend" class="legend" aria-label="Map legend"></div>
      <p id="status" class="status" role="status">Loading restaurants…</p>
    </header>
    <div id="map" class="map" aria-label="Interactive restaurant map"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="map.js"></script>
</body>
</html>
